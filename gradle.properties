org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=false
kotlin.code.style=official

# ─── версия приложения ───────────────────────────────────────────────
#
# Единственное место, где живёт номер версии (A-OP-09).
#
# Почему это отдельное требование, а не гигиена: в боевом приложении
# versionCode равен 32 в трёх подряд собранных APK, при 33 в app.config.
# Система не считает более новую сборку новее, и обновление «поверх»
# не проходит ни одним штатным механизмом — остаётся ручная
# переустановка на каждом устройстве парка (A-7 §6).
#
# Правило: versionCode растёт монотонно при каждой сборке, которая
# уезжает на устройство. versionName человекочитаемый, привязан к этапу.
prtvVersionCode=2
prtvVersionName=A1.1
